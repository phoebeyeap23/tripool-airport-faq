# 新增機場：複製這個檔案，改名為 <國碼>-<機場碼>.yml，例如 kr-icn.yml
# 檔名開頭是底線的檔案不會被建置（所以這個範本不會出現在網站上）。

country: jp          # 要對應 content/countries.yml 裡的 code
code: XXX            # IATA 機場代碼
name:
  zh-TW: ○○機場
  en: XXX Airport
service:
  zh-TW: 接機
  en: Airport Pickup
updated: 2026-01-01

vars:
  freeWaitMinutes: "90"
  overtimeUnit: "30"
  overtimeFee: "2000 日元"
  overtimeFeeEn: "JPY 2,000"
  cancelDays: "3"
  cancelTime: "18:00"
  luggageLarge: "1"
  luggageSmall: "1"
  childSeatRule: ""
  childSeatRuleEn: ""
  meetingPoint: ""
  meetingPointEn: ""

notes:
  - use: contact-on-arrival
  - use: luggage
  - use: child-seat
  - use: flight-change

faq:
  - use: free-waiting
  - use: cancellation
  - use: name-board
  - use: order-confirm
  - use: driver-info
