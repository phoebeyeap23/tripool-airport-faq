country: jp
code: OKA
name:
  zh-TW: 那霸機場
  en: Naha Airport
service:
  zh-TW: 接機
  en: Airport Pickup
updated: 2026-09-08

# ── 變數：共用文字裡的 {{...}} 會代入這裡的值 ──────────────
vars:
  freeWaitMinutes: "90"
  overtimeUnit: "30"
  overtimeFee: "2000 日元"
  overtimeFeeEn: "JPY 2,000"
  cancelDays: "3"
  cancelTime: "18:00"
  luggageLarge: "1"
  luggageSmall: "1"
  childSeatRule: "6 歲以下兒童須使用兒童座椅。"      # TODO 請確認那霸實際規定
  childSeatRuleEn: "children under 6 must use a child seat."  # TODO
  meetingPoint: "國內線航廈 1 樓的接送專屬等候區"     # TODO 請確認實際會合點
  meetingPointEn: "the transfer pickup area on 1F of the Domestic Terminal"  # TODO

# ── 注意事項：use = 引用共用；或直接寫 text 自訂 ────────────
notes:
  - use: contact-on-arrival
  - use: luggage
  - use: child-seat
  - use: flight-change

# ── 常見問題：順序就是網頁上的顯示順序 ──────────────────────
faq:
  - use: free-waiting
  - use: cancellation
  - use: name-board
  - use: order-confirm
  - use: driver-info

  # 這是「本站專屬」寫法的示範，請改成那霸真正需要補充的問答，
  # 或整段刪掉。
  - id: oka-monorail
    q:
      zh-TW: （範例）司機會在哪一個出口等我？
      en: "(Example) Which exit will the driver meet me at?"
    a:
      zh-TW: |
        （範例內容，請替換）司機會在指定的接送專屬等候區等候，詳細位置與地標照片會隨司機資料一併寄出。
      en: |
        (Example content, please replace) Your driver waits in the designated transfer pickup area. The exact location and a landmark photo are sent together with the driver details.

# ── 覆寫共用文字的寫法（示範，可刪）─────────────────────────
# 想沿用共用題目但換掉答案時，在 use 底下直接寫 a：
#   - use: cancellation
#     a:
#       zh-TW: 那霸站點適用的特別取消規則……
#       en: Special cancellation policy for Naha…
