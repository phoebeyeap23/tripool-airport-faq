# 全站設定。改這裡會影響每一頁。
brand:
  name: tripool 旅步
  # 放在 assets/ 底下的檔名，或完整網址
  logo: assets/logo.svg
  site: https://tripool.app
  email: booking@tripool.app

# 網站支援的語言。第一個是預設語言。
