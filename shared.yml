# ─────────────────────────────────────────────────────────────
#  共用內容庫 —— 這是整個網站省工的關鍵。
#  每一則只寫一次，各機場用 `use: <id>` 引用。
#  文字裡的 {{變數}} 會用該機場 vars 的值代入。
#  某個機場想改字，就在該機場檔案裡覆寫 q / a。
# ─────────────────────────────────────────────────────────────

notes:
  - id: luggage
    text:
      zh-TW: 每位乘客以 {{luggageLarge}} 件大型行李與 {{luggageSmall}} 件隨身行李為限，超出請於預訂時備註，以便安排適當車型。
      en: Each passenger may bring {{luggageLarge}} large suitcase(s) and {{luggageSmall}} carry-on item(s). Please note extra luggage when booking so we can assign a suitable vehicle.

  - id: child-seat
    text:
      zh-TW: 依當地法規，{{childSeatRule}}如需兒童座椅請於預訂時告知。
      en: In accordance with local regulations, {{childSeatRuleEn}} Please request a child seat when booking.

  - id: flight-change
    text:
      zh-TW: 若航班有異動（改班、延誤、取消），請盡快於聊天室告知，我們會協助調整接機時間。
      en: If your flight changes (rescheduled, delayed, or cancelled), please tell us in the chat room as soon as possible and we will adjust your pickup time.

  - id: contact-on-arrival
    text:
      zh-TW: 抵達後請開啟手機並保持通訊暢通，司機將於{{meetingPoint}}等候。
      en: After landing, please keep your phone reachable. Your driver will be waiting at {{meetingPointEn}}.

faq:
  - id: free-waiting
    q:
      zh-TW: 免費等待時間多久呢？
      en: How long is the free waiting time?
    a:
      zh-TW: |
        免費等待時間：按照航班實際落地免費等待 {{freeWaitMinutes}} 分鐘，超過 {{freeWaitMinutes}} 分鐘按每 {{overtimeUnit}} 分鐘 {{overtimeFee}} 收取延時費用（不足 {{overtimeUnit}} 分鐘的按 {{overtimeUnit}} 分鐘 {{overtimeFee}} 收取）。
      en: |
        Free waiting time starts from your flight's actual landing time and lasts {{freeWaitMinutes}} minutes. Beyond {{freeWaitMinutes}} minutes, a waiting fee of {{overtimeFeeEn}} per {{overtimeUnit}} minutes applies (any part of a {{overtimeUnit}}-minute block is charged as a full block).

  - id: cancellation
    q:
      zh-TW: 最晚取消修改期限？
      en: What is the cancellation and change deadline?
    a:
      zh-TW: |
        請於行前 {{cancelDays}} 天 {{cancelTime}}（GMT+8）前取消預訂，取消後將獲得全額退款，退款將在 7–14 個工作日內處理完成。逾時取消將無法獲得退款，請謹慎安排您的行程。
      en: |
        Please cancel at least {{cancelDays}} days before your trip, by {{cancelTime}} (GMT+8). Cancellations made before the deadline receive a full refund, processed within 7–14 business days. Cancellations after the deadline are non-refundable, so please plan your itinerary carefully.

  - id: order-confirm
    q:
      zh-TW: 如何確認訂單沒問題？
      en: How do I know my booking is confirmed?
    a:
      zh-TW: |
        預訂完成後，您將收到訂單確認信 email。客服團隊也會在用車前 2 天 12:00 透過 [{{email}}](mailto:{{email}}) 和您確認行程資訊。
      en: |
        Once your booking is complete you will receive a confirmation email. Our support team will also confirm your itinerary 2 days before the ride, at 12:00, from [{{email}}](mailto:{{email}}).

  - id: driver-info
    q:
      zh-TW: 司機資料什麼時候提供？
      en: When will I receive my driver's details?
    a:
      zh-TW: |
        司機資料將在用車前 1 天 21:00 透過 [{{email}}](mailto:{{email}}) 寄送，司機資料也會同步更新在聊天室的右側。
      en: |
        Driver details are sent 1 day before the ride, at 21:00, from [{{email}}](mailto:{{email}}). The same information is also shown on the right-hand side of your chat room.

  - id: name-board
    q:
      zh-TW: 是否有舉牌服務？
      en: Is there a name-board (meet & greet) service?
    a:
      zh-TW: |
        本方案不包含舉牌服務，司機將於指定的接駁專屬等候區域等待旅客。若是需要增加舉牌服務，請聯繫客服。
      en: |
        This plan does not include name-board meet & greet. Your driver will wait in the designated transfer pickup area. If you would like to add a name-board service, please contact our support team.

  - id: extra-stop
    q:
      zh-TW: 可以中途加點嗎？
      en: Can I add a stop along the way?
    a:
      zh-TW: |
        可以，請於預訂時在備註欄填寫加點地址，客服將依距離報價。行程開始後臨時加點需視司機後續班表而定，恕無法保證。
      en: |
        Yes. Please enter the additional address in the notes field when booking and our team will quote based on distance. Stops added after the trip has started depend on the driver's later schedule and cannot be guaranteed.
